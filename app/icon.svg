<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- favicon: a tiny night skyline (the brownstone, the tower, the round tower) under an orange moon -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#121212"/>
    <!-- moon -->
    <circle cx="47.5" cy="15" r="5.5" fill="#F37021"/>
    <!-- left: the brownstone -->
    <rect x="7" y="33" width="15" height="31" fill="#F37021"/>
    <rect x="12" y="45" width="5" height="9" rx="1" fill="#81D8D0"/>
    <!-- middle: the tower, with a stepped crown and lit windows -->
    <rect x="24" y="19" width="16" height="45" fill="#F6EFE3"/>
    <rect x="27" y="15" width="10" height="4" fill="#F6EFE3"/>
    <rect x="30.5" y="9" width="3" height="6" fill="#F6EFE3"/>
    <g fill="#121212">
      <rect x="27" y="24" width="3.5" height="4"/><rect x="33.5" y="24" width="3.5" height="4"/>
      <rect x="27" y="32" width="3.5" height="4"/><rect x="33.5" y="32" width="3.5" height="4"/>
      <rect x="27" y="40" width="3.5" height="4"/>
    </g>
    <rect x="33.5" y="40" width="3.5" height="4" fill="#F37021"/>
    <!-- right: the round tower -->
    <rect x="42" y="29" width="15" height="35" fill="#81D8D0"/>
    <path d="M42 29 L49.5 22 L57 29 Z" fill="#81D8D0"/>
    <!-- street -->
    <rect y="56" width="64" height="8" fill="#121212"/>
    <rect x="7" y="56" width="50" height="1.5" fill="#F6EFE3" opacity="0.35"/>
  </g>
</svg>
